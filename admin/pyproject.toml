[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "admin"
version = "0.0.1"
description = "Admin tools for SparkAggregationMethods"
requires-python = "==3.13.*"
dependencies = [
    "pyarrow",
    "scipy",
    "pandas",
    "numpy",
    "spark_agg_methods_common_python"
]

[dependency-groups]
dev = [
    "pytest",
    "flake8",
    "autopep8",
    "isort",
    "ty",
    "pre-commit"
]

[tool.uv.sources]
spark_agg_methods_common_python = { path = "..", editable = true }
