fail_fast: true
default_language_version:
  python: python3.10
repos:
- repo: https://github.com/PyCQA/isort
  rev: 9.0.1
  hooks:
  - id: isort

- repo: local
  hooks:
  - id: autopep8-all
    name: autopep8 all modules
    entry: uv run python scripts/run_all_autopep8.py
    language: system
    always_run: true
    pass_filenames: false

  - id: flake8-all
    name: flake8 all modules
    entry: uv run python scripts/run_all_flake8.py
    language: system
    always_run: true
    pass_filenames: false

  - id: ty-check
    name: ty type checker
    entry: uv run python -m ty check --extra-search-path ./common_python --extra-search-path ./simple_queued_pipelines
    language: system
    always_run: true
    pass_filenames: false

  - id: pytest-fast-commit
    name: pytest fast modules (commit)
    entry: uv run python scripts/run_all_tests.py --exclude py_spark
    language: system
    always_run: true
    pass_filenames: false
    stages: [pre-commit]

  - id: pytest-all-push
    name: pytest all modules (push)
    entry: uv run python scripts/run_all_tests.py
    language: system
    always_run: true
    pass_filenames: false
    stages: [pre-push]
