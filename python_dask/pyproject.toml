[project]
name = "python-dask"
version = "0.0.1"
description = "Aggregation challenge solutions using Dasc"
requires-python = ">=3.12"
dependencies = [
    "dask-sql",
    "dask[dataframe]",
    "dask[distributed]",
    "numpy",
    "pandas",
    "pyarrow",
    "spark_agg_methods_common_python",
]

[dependency-groups]
dev = [
    "autopep8",
    "flake8",
    "isort",
    "pre-commit",
    "pytest",
    "ty",
]

[tool.uv.sources]
spark_agg_methods_common_python = { path = "..", editable = true }
