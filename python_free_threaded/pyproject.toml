[project]
name = "python-free-threaded"
version = "0.0.1"
description = "Python Free-Threaded methods"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "spark_agg_methods_common_python",
    "simple-queued-pipelines"
]

[tool.uv.sources]
spark_agg_methods_common_python = { path = "..", editable = true }
simple-queued-pipelines = { path = "../simple_queued_pipelines", editable = true }


[dependency-groups]
dev = [
    "pytest",
    "flake8",
    "autopep8",
    "isort",
    "ty",
    "pre-commit"
]
