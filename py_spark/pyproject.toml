[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "python-pyspark"
version = "0.0.1"
description = "Aggregation challenge solutions using PySpark"
requires-python = "==3.10.*"
dependencies = [
    "findspark",
    "networkx",
    "numba>=0.68.0",
    "pyarrow>=25.0.1",
    "pyspark==3.5.9",
    "spark_agg_methods_common_python",
]

[dependency-groups]
dev = [
    "autopep8",
    "flake8",
    "isort",
    "pre-commit",
    "pytest",
    "ty",
]

[tool.uv.sources]
spark_agg_methods_common_python = { path = "..", editable = true }
