[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "python-single-threaded"
version = "0.0.1"
description = "Baseline implementations for the aggregation challenges using single-threaded Python with and without GPU acceleration"
requires-python = "==3.14.*"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow",
    "spark_agg_methods_common_python",
]

[dependency-groups]
dev = [
    "autopep8",
    "flake8",
    "isort",
    "pre-commit",
    "pytest",
    "ty",
]

[tool.uv.sources]
spark_agg_methods_common_python = { path = "..", editable = true }

