[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "admin"
version = "0.0.1"
description = "Tooling for generating test data and analyzing test results"
requires-python = "==3.14.*"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "spark_agg_methods_common_python",
]

[dependency-groups]
dev = [
    "autopep8",
    "flake8",
    "isort",
    "pre-commit",
    "pytest",
    "ty",
]

[tool.uv.sources]
spark_agg_methods_common_python = { path = "..", editable = true }
