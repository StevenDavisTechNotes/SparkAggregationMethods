[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "python-free-threaded"
version = "0.0.1"
description = "Solutions to the aggregation challenges using multi-threading managed by queues"
requires-python = "==3.14.*"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow>=26.0.0",
    "simple-queued-pipelines",
    "spark_agg_methods_common_python",
]

[dependency-groups]
dev = [
    "autopep8",
    "flake8",
    "isort",
    "pre-commit",
    "pytest",
    "ty",
]

[tool.ty.environment]
extra-paths = ["../common_python"]

[tool.uv.sources]
simple_queued_pipelines = { path = "../simple_queued_pipelines", editable = true }
spark_agg_methods_common_python = { path = "..", editable = true }
